services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env.local
    ports:
      - "4000:4000"
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      - api
    ports:
      - "3000:3000"
